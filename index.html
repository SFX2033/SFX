<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pauline - Portfolio</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Poppins:wght@300;400&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background-color: #f8f9fa;
        }
        .hero-section {
            height: 100vh;
            background: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.5)), url('public/images/popo.jpg');
            background-size: cover;
            background-position: center;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            text-align: center;
        }
        h1 {
            font-family: 'Playfair Display', serif;
            font-size: 5rem;
            letter-spacing: 2px;
            text-transform: uppercase;
        }
        .profile-img {
            width: 250px;
            height: 250px;
            object-fit: cover;
            border: 8px solid white;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }
        .accent-color {
            color: #ff6b6b;
        }
        .btn-custom {
            background-color: #ff6b6b;
            color: white;
            border-radius: 30px;
            padding: 10px 30px;
            transition: 0.3s;
        }
        .btn-custom:hover {
            background-color: #ee5253;
            transform: translateY(-3px);
        }
    </style>
</head>
<body>

    <header class="hero-section">
        <div class="container">
            <h1 class="display-1 fw-bold" id="titre-site">Pauline</h1>
            <p class="lead fs-3">Bienvenue dans mon univers</p>
            <a href="#about" class="btn btn-custom mt-4">Découvrir</a>
        </div>
    </header>

    <section id="about" class="py-5">
        <div class="container py-5">
            <div class="row align-items-center">
                <div class="col-lg-5 text-center mb-4 mb-lg-0">
                    <img src="public/images/popo.jpg" alt="Pauline" class="rounded-circle profile-img">
                </div>
                <div class="col-lg-7">
                    <h2 class="display-4 fw-bold mb-4">Hello, c'est <span class="accent-color">Papa</span></h2>
                    <p class="text-muted fs-5" id="texte-presentation">
                        Passionnée par le développement, le design et les nouvelles technologies. 
                        Ce site est un petit espace dédié à mes projets et mes inspirations.
                    </p>
                    <p id="tarif-affichage">1200 €</p>
                    <hr class="my-4" style="width: 50px; border: 2px solid #ff6b6b;">
                    <div class="d-flex gap-3">
                        <div class="p-2 border rounded text-center" style="width: 100px;">
                            <span class="fw-bold d-block">Creative</span>
                        </div>
                        <div class="p-2 border rounded text-center" style="width: 100px;">
                            <span class="fw-bold d-block">Curieuse</span>
                        </div>
                        <div class="p-2 border rounded text-center" style="width: 100px;">
                            <span class="fw-bold d-block">PHP Lover</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <footer class="bg-dark text-white text-center py-4">
        <p class="mb-0">&copy; 2026 - Fait avec &hearts; pour Pauline</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="public/js/script.js"></script>
</body>
</html>
